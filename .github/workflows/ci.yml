name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  client-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pyinstaller==6.21.0
      - name: source and native package acceptance
        shell: pwsh
        run: |
          $env:TEMP = (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName
          $env:TMP = $env:TEMP
          python scripts/build_client_package.py "$env:RUNNER_TEMP/canon-source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_client_package.py "$env:RUNNER_TEMP/canon-native" --native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  repo-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the README drawings still match their spec
        run: python tools/check_repo_art.py
      - name: the committed drawings are the ones the spec renders
        run: |
          python tools/render_repo_art.py
          git diff --exit-code
