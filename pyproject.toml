[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flywheel-canon"
version = "0.5.0"
description = "A provider-neutral memory-bank, personality container, and continuity capsule CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "HarperZ9" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/HarperZ9/canon"
Source = "https://github.com/HarperZ9/canon"
Changelog = "https://github.com/HarperZ9/canon/blob/main/CHANGELOG.md"
Issues = "https://github.com/HarperZ9/canon/issues"

[project.scripts]
canon = "canon.cli:main"
canon-client = "canon.client_mcp:main"

[project.optional-dependencies]
# setuptools builds the sdist that tests/test_packaging.py inspects.
dev = ["pytest>=8", "setuptools>=77"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
