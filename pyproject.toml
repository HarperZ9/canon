[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canon"
version = "0.0.0"
description = "A provider-neutral memory-bank and personality container."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "FSL-1.1-MIT" }
authors = [{ name = "HarperZ9" }]
dependencies = []

[project.scripts]
canon = "canon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
